name: Publish existing Rust release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-rust-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check package version
        run: python scripts/check_release_version.py "$RELEASE_TAG"
      - name: Require successful CI for the released source
        uses: actions/github-script@v9
        with:
          script: |
            const source = (await exec.getExecOutput('git', ['rev-parse', 'HEAD'])).stdout.trim();
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', head_sha: source, per_page: 100
            });
            const verified = data.workflow_runs.find(run =>
              run.head_sha === source && run.event === 'push' && run.head_branch === 'main' &&
              run.status === 'completed' && run.conclusion === 'success');
            if (!verified) throw new Error('No successful main CI for the released source');
            core.notice(`Verified source using ${verified.html_url}`);
      - name: Download existing release crate
        run: |
          gh release download "$RELEASE_TAG" --dir dist --pattern '*.crate' --pattern SHA256SUMS
      - name: Package the released source
        run: cargo package -p ofdrw --locked --no-verify
      - name: Verify source archive against immutable release
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile
          version = os.environ['RELEASE_TAG'][1:]
          name = f'ofdrw-{version}.crate'
          directory = Path('dist')
          checksums = {}
          for line in (directory / 'SHA256SUMS').read_text().splitlines():
              digest, filename = line.split(maxsplit=1)
              checksums[filename.lstrip('*')] = digest
          for path in [directory / name, Path('target/package') / name]:
              with path.open('rb') as source:
                  actual = hashlib.file_digest(source, 'sha256').hexdigest()
              assert actual == checksums.get(name), f'Archive mismatch: {path}'
          source_commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with tarfile.open(directory / name, 'r:gz') as archive:
              info = json.load(archive.extractfile(f'ofdrw-{version}/.cargo_vcs_info.json'))
          assert info['git']['sha1'] == source_commit, 'Crate source differs from the released tag'
          assert not info['git'].get('dirty', False), 'Release crate has uncommitted source changes'
          print(f'Verified immutable source archive for {source_commit}')
      - name: Publish Rust core to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python scripts/publish_native_registry.py cargo "$RELEASE_TAG" dist
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Install and run published Rust and Go libraries
        run: python scripts/check_registry_consumers.py "$RELEASE_TAG"
