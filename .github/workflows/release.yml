name: Repair published Python wheel architecture labels
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 712b4ad
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download and verify the published wheel files
        run: |
          python -m pip install wheel twine
          gh release download v0.1.0 --pattern '*.whl' --pattern SHA256SUMS --dir dist
          cd dist
          sha256sum --ignore-missing --check SHA256SUMS
      - name: Repair labels and preserve native library bytes
        run: |
          python scripts/repair_mac_wheels.py dist --report repairs.json
          python scripts/repair_mac_wheels.py dist --check-only
          python -m twine check --strict dist/*.whl
          python - <<'PYREPAIR'
          import hashlib, json
          from pathlib import Path
          repairs = json.loads(Path('repairs.json').read_text())
          assert len(repairs) == 2, repairs
          sums = Path('dist/SHA256SUMS')
          rows = dict(line.split('  ', 1)[::-1] for line in sums.read_text().splitlines())
          for item in repairs:
              del rows[item['old']]
              rows[item['new']] = hashlib.sha256((Path('dist') / item['new']).read_bytes()).hexdigest()
          sums.write_text(''.join(f'{digest}  {name}\n' for name, digest in sorted(rows.items())))
          PYREPAIR
      - name: Replace only the corrected wheel metadata assets
        run: |
          python - <<'PYUPLOAD'
          import json, subprocess
          from pathlib import Path
          repairs = json.loads(Path('repairs.json').read_text())
          for item in repairs:
              subprocess.run(['gh', 'release', 'upload', 'v0.1.0', 'dist/' + item['new'], '--clobber'], check=True)
          subprocess.run(['gh', 'release', 'upload', 'v0.1.0', 'dist/SHA256SUMS', '--clobber'], check=True)
          for item in repairs:
              subprocess.run(['gh', 'release', 'delete-asset', 'v0.1.0', item['old'], '--yes'], check=True)
          PYUPLOAD
          cd dist
          sha256sum --ignore-missing --check SHA256SUMS
