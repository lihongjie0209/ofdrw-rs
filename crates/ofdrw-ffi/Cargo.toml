[package]
name = "ofdrw-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ofdrw_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
ofdrw = { path = "../ofdrw" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.23.1"

[dev-dependencies]
tempfile.workspace = true

